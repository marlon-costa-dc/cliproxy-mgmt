name: Release vi panel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set release version
        run: echo "VERSION=vi-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build
        run: bun run build

      - name: Package management.html
        run: cp dist/index.html dist/management.html

      # Updater của CLIProxyAPI tìm asset tên đúng "management.html"
      # trong release mới nhất của repo trỏ ở panel-github-repository.
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$VERSION"
          gh release create "$TAG" dist/management.html \
            --title "Vi panel $TAG" \
            --notes "Bản build fork tiếng Việt của Management Center. Commit: ${{ github.sha }}. Server CLIProxyAPI tự kéo qua panel-github-repository."
