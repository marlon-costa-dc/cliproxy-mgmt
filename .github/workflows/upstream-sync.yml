name: Sync upstream mirrors

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the mirror status without creating branches or PRs
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DRY_RUN: ${{ inputs.dry_run || false }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: dc-use
          fetch-depth: 0
          fetch-tags: true

      - name: Configure git
        run: |
          git config user.name "cpamc-fork-sync[bot]"
          git config user.email "cpamc-fork-sync@users.noreply.github.com"
          git fetch origin --prune

      - name: Sync official mirror (main)
        env:
          SOURCE_URL: https://github.com/router-for-me/Cli-Proxy-API-Management-Center.git
          MIRROR: main
        run: ./.github/scripts/sync-mirror.sh

      - name: Sync plus mirror (plus)
        env:
          SOURCE_URL: https://github.com/kaitranntt/Cli-Proxy-API-Management-Center.git
          MIRROR: plus
        run: ./.github/scripts/sync-mirror.sh
