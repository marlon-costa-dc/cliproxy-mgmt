name: Sync Fork Release Tag

on:
  push:
    branches: [dc-use]
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Compute and print the next tag without creating or releasing it
        required: false
        type: boolean
        default: true
      force_release:
        description: Tag even when the change set is not panel-affecting
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: write

concurrency:
  group: sync-release-tag
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DRY_RUN: ${{ inputs.dry_run || false }}
  FORCE_RELEASE: ${{ inputs.force_release || false }}

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "cpamc-fork-sync[bot]"
          git config user.email "cpamc-fork-sync@users.noreply.github.com"

      - name: Verify backend API contract
        id: contract
        env:
          BACKEND_API_PREFIX: ${{ vars.CLIPROXY_BACKEND_API_PREFIX }}
          PANEL_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if ./.github/scripts/verify-backend-api-contract.sh; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "[i] Panel/backend API contract mismatch; holding the automatic tag until they match."
          fi

      - name: Fetch upstream tags
        run: |
          git remote add upstream https://github.com/router-for-me/Cli-Proxy-API-Management-Center.git
          git fetch upstream main

      - name: Create missing fork release tag
        if: steps.contract.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # If HEAD already has a released tag, do not create another one. This
          # keeps the manually published v1.10.2 dashboard release canonical.
          for tag in $(git tag --points-at HEAD --list 'v*' --sort=-v:refname); do
            if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              echo "[i] HEAD is already released as ${tag}; nothing to tag."
              exit 0
            fi
          done

          UPSTREAM_TAG=""
          if [ -f .cpamc-fork-upstream.env ]; then
            # shellcheck disable=SC1091
            . ./.cpamc-fork-upstream.env
          fi

          if ! echo "${UPSTREAM_TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            UPSTREAM_TAG=$(git ls-remote --tags --refs upstream 'v[0-9]*.[0-9]*.[0-9]*' \
              | awk '{print $2}' \
              | sed 's|refs/tags/||' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -1 || true)
          fi

          if [ -z "${UPSTREAM_TAG}" ]; then
            echo "[i] No synced upstream release tag found; nothing to tag."
            exit 0
          fi

          latest_release_tag=""
          for tag in $(git tag --merged HEAD --list 'v*' --sort=-v:refname); do
            if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              latest_release_tag="${tag}"
              break
            fi
          done

          if [ -n "${latest_release_tag}" ]; then
            changed_paths="$(git diff --name-only "${latest_release_tag}..HEAD" || true)"
            if [ -z "${changed_paths}" ]; then
              echo "[i] No changes since ${latest_release_tag}; nothing to tag."
              exit 0
            fi
            if [ "${FORCE_RELEASE}" != "true" ] && ! printf '%s\n' "${changed_paths}" \
              | grep -Eq '^(src/|public/|index\.html$|package\.json$|bun\.lock$|vite\.config\.(ts|js)$|tsconfig[^/]*\.json$|postcss\.config\.(ts|js|cjs|mjs)$|tailwind\.config\.(ts|js|cjs|mjs)$)'; then
              echo "[i] No panel-affecting changes since ${latest_release_tag}; nothing to tag."
              exit 0
            fi
          fi

          dispatch_release() {
            local tag="$1"
            if [[ "${DRY_RUN}" == "true" ]]; then
              echo "[dry-run] Would dispatch release.yml for ${tag}."
              return 0
            fi
            gh workflow run release.yml --repo "${GITHUB_REPOSITORY}" --ref "${GITHUB_REF_NAME}" -f tag="${tag}"
          }

          latest_release_core=""
          if [ -n "${latest_release_tag}" ]; then
            latest_release_core="$(echo "${latest_release_tag}" | sed -E 's/^((v[0-9]+\.[0-9]+\.[0-9]+))(-(dc)?[0-9]+)?$/\1/')"
          fi

          RELEASE_BASE_TAG="${UPSTREAM_TAG}"
          if echo "${latest_release_core}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            RELEASE_BASE_TAG="$(printf "%s\n%s\n" "${UPSTREAM_TAG}" "${latest_release_core}" | sort -V | tail -1)"
          fi

          start_suffix=1

          next_tag=""
          for i in $(seq "${start_suffix}" 20); do
            candidate="${RELEASE_BASE_TAG}-dc${i}"
            if ! git ls-remote --exit-code --tags origin "refs/tags/${candidate}" >/dev/null 2>&1; then
              next_tag="${candidate}"
              break
            fi

            candidate_sha="$(git rev-list -n 1 "${candidate}" 2>/dev/null || true)"
            head_sha="$(git rev-parse HEAD)"
            if [ "${candidate_sha}" = "${head_sha}" ]; then
              if gh release view "${candidate}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
                echo "[i] ${candidate} release already exists for HEAD; nothing to tag."
                exit 0
              fi
              echo "[i] ${candidate} tag already exists for HEAD and is eligible for release dispatch."
              dispatch_release "${candidate}"
              exit 0
            fi
          done

          if [ -z "${next_tag}" ]; then
            echo "[!] Could not find an unused fork tag suffix for ${RELEASE_BASE_TAG}."
            exit 1
          fi

          if [ "${DRY_RUN}" = "true" ]; then
            echo "[dry-run] Would create ${next_tag} for release base ${RELEASE_BASE_TAG} and upstream ${UPSTREAM_TAG}."
            exit 0
          fi

          echo "[i] Creating ${next_tag} for release base ${RELEASE_BASE_TAG} and upstream ${UPSTREAM_TAG}."
          git tag -a "${next_tag}" -m "CPAMC ${next_tag} (upstream ${UPSTREAM_TAG})"
          git push origin "refs/tags/${next_tag}"
          dispatch_release "${next_tag}"
